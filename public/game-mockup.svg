<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <style>text{fill:#e9f1e9;font-family:system-ui,sans-serif}.label{font:12px monospace;letter-spacing:2px;fill:#a1b8af}.small{font-size:14px;fill:#a1b8af}.title{font:48px Georgia,serif}.button{font-size:15px;font-weight:600}</style>
  <rect width="1200" height="820" fill="#102c30"/>
  <g id="header"><text x="50" y="46" class="label">TRICKY WORDS</text><text x="50" y="103" class="title">A very unstable vocabulary.</text><text x="50" y="134" class="small">Make a shape. Find its balance. Build a taller tower.</text><text x="980" y="54" class="label">LOCAL PLAYTEST</text></g>
  <g id="playfield"><rect x="50" y="170" width="750" height="570" rx="16" fill="#183b40" stroke="#3a5b5b"/><path d="M70 660H780 M70 560H780 M70 460H780 M70 360H780" stroke="#305054" stroke-dasharray="3 8"/><text x="75" y="205" class="label">HEIGHT</text><text x="75" y="237" font-size="28">2.4 m</text><text x="640" y="205" class="label">STACKED</text><text x="640" y="237" font-size="28">04</text><path d="M315 674V700H535V674Z" fill="#b5c797"/><path d="M325 700L305 740H545L525 700" fill="#526756"/><image href="samples/slipper.png" x="315" y="544" width="200" height="160"/><image href="samples/teapot.png" x="330" y="417" width="180" height="170"/><image href="samples/orange.png" x="350" y="270" width="145" height="145" opacity=".9"/><text x="320" y="766" class="small">← → Move　 Q / E Rotate　 Space Drop</text></g>
  <g id="controls"><text x="845" y="205" class="label">YOUR NEXT OBJECT</text><text x="845" y="249" font-size="28">teapot</text><rect x="840" y="280" width="305" height="52" rx="6" fill="#d2e5aa"/><text x="935" y="312" fill="#102c30" class="button" style="fill:#102c30">Drop object ↓</text><text x="845" y="375" class="label">PLAY RIGHT NOW</text><rect x="840" y="396" width="305" height="48" rx="6" fill="none" stroke="#78918a"/><text x="905" y="426" class="button">Play saved shapes</text><text x="845" y="490" class="label">OR MAKE YOUR OWN</text><rect x="840" y="511" width="305" height="48" rx="6" fill="#1e4144" stroke="#78918a"/><text x="857" y="542" font-size="16">slipper</text><rect x="840" y="575" width="305" height="48" rx="6" fill="none" stroke="#78918a"/><text x="923" y="605" class="button">Load AI models</text><text x="845" y="655" class="small">Models load once. Each new object</text><text x="845" y="678" class="small">is generated on your device.</text></g>
</svg>
